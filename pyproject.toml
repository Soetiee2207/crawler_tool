[project]
name = "threads-crawler"
version = "0.1.0"
description = "Crawl Threads posts (keyword/hashtag search, replies, media) as raw material for TikTok videos"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "playwright>=1.48",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pillow>=11.0",
    "soundfile>=0.12",
    "numpy>=1.26",
    "onnxruntime>=1.24,<1.25",  # bản mới hơn chặn external data trong HF cache (symlink blobs)
    "huggingface_hub<2",  # hub 2.x lưu blob theo thư mục con -> onnxruntime từ chối file .data
    "vieneu @ git+https://github.com/Soetiee2207/VieNeu-TTS.git",
]

[project.scripts]
threads-crawler = "threads_crawler.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
